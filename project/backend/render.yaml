services:
  - type: web
    name: aiono-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt && python -m app.seed || echo "Seed skipped"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./aiono.db
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: ALLOWED_ORIGINS
        value: https://aiono-frontend.vercel.app,https://aiono-frontend-8j9elcx9y-harshitj183s-projects.vercel.app,http://localhost:3000,http://localhost:3001
